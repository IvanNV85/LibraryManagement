spring.application.name=LibraryManagementSystem
server.port=9999

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=libraryManagementdb;encrypt=false
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.banner.charset=utf-8

# ---------- Ứng dụng (UC1 - UC5) ----------
# Địa chỉ gốc dùng để tạo liên kết trong email (xác thực email, đặt lại mật khẩu)
app.base-url=http://localhost:${server.port}
# Thư mục lưu ảnh upload (ảnh đại diện, ảnh bìa sách). Đã được ignore trong .gitignore
app.upload-dir=uploads
# Giới hạn cứng của server. Giới hạn 2MB cho ảnh do FileStorageService kiểm tra để báo lỗi thân thiện
# (nếu đặt 2MB ở đây thì ảnh lớn hơn sẽ ra trang lỗi 500 thay vì thông báo "Ảnh tối đa 2MB")
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Quy tắc đăng nhập và token
app.auth.max-failed-logins=5
app.auth.lock-minutes=15
app.auth.verify-token-hours=24
app.auth.reset-token-minutes=30

# ---------- Gửi email ----------
# Không ghi mật khẩu vào file này. Đặt biến môi trường MAIL_USERNAME và MAIL_PASSWORD
# (với Gmail dùng "App password"). Chưa cấu hình thì email không gửi được,
# nhưng nội dung (có liên kết) vẫn được in ra log để dùng khi phát triển.
app.mail.from=${MAIL_USERNAME:no-reply@library.local}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
