spring.application.name=LibraryManagementSystem
server.port=8080

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=libraryManagementdb;encrypt=false
spring.datasource.username=sa
spring.datasource.password=123

# Không để Hibernate tự tạo/sửa bảng: DB do script src/main/resources/db/library_management_full.sql tạo
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.banner.charset=utf-8

# ---------- Ứng dụng ----------
# Thư mục lưu ảnh upload (ảnh bìa sách ở UC20). Đã được ignore trong .gitignore
app.upload-dir=uploads
# Giới hạn cứng của server. Giới hạn 2MB cho ảnh do FileStorageService kiểm tra để báo lỗi thân thiện
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME:}
app.base-url=http://localhost:8080