<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  MENU CỦA THỦ THƯ (hiện cho cả LIBRARIAN và ADMIN, vì admin cũng được vào /librarian/**).
  Thêm chức năng mới: copy một thẻ <a class="account-item"> bên dưới, đổi đường dẫn, tên và icon.
  Đường dẫn bắt đầu bằng /librarian/.
  Gợi ý: UC6 quản lý độc giả, UC16 duyệt yêu cầu mượn, UC17 lập phiếu, UC18 trả sách, UC20 đầu sách, UC21 bản sao.
-->
<th:block th:fragment="items">
    <a class="account-item" th:href="@{/librarian/readers}">
        <span class="icon-circle"><i class="bi bi-people"></i></span>Quản lý độc giả
    </a>
    <a class="account-item" th:href="@{/librarian/copies}">
        <span class="icon-circle"><i class="bi bi-bookshelf"></i></span>Quản lý bản sao
    </a>
    <a class="account-item" th:href="@{/librarian/purchase-orders}">
        <span class="icon-circle"><i class="bi bi-box-seam"></i></span>Phiếu nhập sách
    </a>
</th:block>
</body>
</html>
