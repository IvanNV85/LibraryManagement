<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hồ sơ cá nhân')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-4" style="max-width: 720px;">
    <div class="card">
        <div class="card-body">
            <h4 class="mb-3">Hồ sơ cá nhân</h4>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

            <div class="d-flex align-items-center gap-3 mb-4">
                <img th:if="${user.avatarUrl != null}" class="avatar-lg" th:src="@{${user.avatarUrl}}" alt="Ảnh đại diện">
                <div th:if="${user.avatarUrl == null}" class="avatar-lg"></div>
                <div>
                    <div class="fw-bold" th:text="${user.fullName}">Họ tên</div>
                    <div class="text-muted" th:text="${user.email}">email</div>
                </div>
            </div>

            <!-- Thông tin thẻ: chỉ xem, không sửa được -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Mã thẻ</label>
                    <input class="form-control" type="text" th:value="${card != null and card.cardCode != null} ? ${card.cardCode} : 'Chưa có'" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Trạng thái thẻ</label>
                    <input class="form-control" type="text" th:value="${card != null} ? ${card.status.label} : '-'" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Hạn thẻ</label>
                    <input class="form-control" type="text"
                           th:value="${card != null and card.expiryDate != null} ? ${card.expiryDate} : '-'" disabled>
                </div>
            </div>

            <form th:action="@{/reader/profile}" th:object="${form}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label" for="fullName">Họ tên</label>
                    <input class="form-control" type="text" id="fullName" th:field="*{fullName}" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Số điện thoại</label>
                    <input class="form-control" type="tel" id="phone" th:field="*{phone}" maxlength="10"
                           pattern="0[0-9]{9}" title="10 chữ số, bắt đầu bằng 0" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="address">Địa chỉ</label>
                    <input class="form-control" type="text" id="address" th:field="*{address}" maxlength="255">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="avatar">Ảnh đại diện (JPG hoặc PNG, tối đa 2MB)</label>
                    <input class="form-control" type="file" id="avatar" name="avatar" accept="image/jpeg,image/png">
                </div>
                <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
