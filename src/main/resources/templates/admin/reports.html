<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Báo cáo thống kê')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container my-4">
    <div class="panel page-spacer">
        <h3>BÁO CÁO THỐNG KÊ</h3>
        <hr>
        <div class="row g-3 mt-2">
            <div class="col-md-4"><div class="card h-100"><div class="card-body">
                <h5 class="card-title">Đang mượn</h5><p class="fs-2 mb-0" th:text="${statistics.onLoan}">0</p>
            </div></div></div>
            <div class="col-md-4"><div class="card h-100"><div class="card-body">
                <h5 class="card-title">Quá hạn</h5><p class="fs-2 mb-0" th:text="${statistics.overdue}">0</p>
            </div></div></div>
            <div class="col-md-4"><div class="card h-100"><div class="card-body">
                <h5 class="card-title">Sẵn sàng cho mượn</h5><p class="fs-2 mb-0" th:text="${statistics.available}">0</p>
            </div></div></div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
