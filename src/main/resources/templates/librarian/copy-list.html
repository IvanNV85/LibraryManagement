<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout-librarian :: head('Quản lý bản sao sách')}"></head>

<body>
    <div class="dashboard-layout">
        <aside th:replace="~{fragments/layout-librarian :: sidebar('copies')}"></aside>
        <div class="dashboard-main">
            <header th:replace="~{fragments/layout-librarian :: topbar('Quản lý bản sao sách')}"></header>
            <main class="dashboard-content">
                <div class="w-100">
                    <div class="panel border-0 shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <h3>QUẢN LÝ BẢN SAO SÁCH</h3>
                            <a class="btn btn-primary" th:href="@{/librarian/copies/new}">Thêm bản sao</a>
                        </div>
                        <hr>
                        <div th:replace="~{fragments/layout :: alerts}"></div>
                        <form class="row g-3 align-items-center" method="get" th:action="@{/librarian/copies}">
                            <div class="col-md-6"><input class="form-control" name="keyword" th:value="${keyword}"
                                    maxlength="100" placeholder="Barcode, tên sách hoặc ISBN"></div>
                            <div class="col-md-3"><select class="form-select" name="status">
                                    <option value="ALL">Tất cả trạng thái</option>
                                    <option value="AVAILABLE" th:selected="${status == 'AVAILABLE'}">Sẵn sàng</option>
                                    <option value="HELD" th:selected="${status == 'HELD'}">Đang giữ</option>
                                    <option value="BORROWED" th:selected="${status == 'BORROWED'}">Đang mượn</option>
                                    <option value="DAMAGED" th:selected="${status == 'DAMAGED'}">Bị hỏng</option>
                                    <option value="LOST" th:selected="${status == 'LOST'}">Mất sách</option>
                                    <option value="DISPOSED" th:selected="${status == 'DISPOSED'}">Đã thanh lý</option>
                                </select></div>
                            <div class="col-auto"><button class="btn btn-primary">Tìm kiếm</button></div>
                        </form>
                        <h4 class="mt-4">Danh sách bản sao (<span th:text="${result.totalElements}">0</span>)</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Barcode</th>
                                        <th>Tên sách</th>
                                        <th>ISBN</th>
                                        <th>Vị trí kệ</th>
                                        <th>Trạng thái</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="copy : ${result.content}">
                                        <td th:text="${copy.barcode}"></td>
                                        <td th:text="${copy.book.title}"></td>
                                        <td th:text="${copy.book.isbn}"></td>
                                        <td
                                            th:text="${copy.shelfLocation != null and !copy.shelfLocation.isBlank() ? copy.shelfLocation : '—'}">
                                        </td>
                                        <td>
                                            <span th:if="${copy.status.name() == 'AVAILABLE'}" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1"><i class="bi bi-check-circle me-1"></i>Sẵn sàng</span>
                                            <span th:if="${copy.status.name() == 'HELD'}" class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1"><i class="bi bi-bookmark-check me-1"></i>Đang giữ</span>
                                            <span th:if="${copy.status.name() == 'BORROWED'}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1"><i class="bi bi-book-half me-1"></i>Đang mượn</span>
                                            <span th:if="${copy.status.name() == 'DAMAGED'}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1"><i class="bi bi-exclamation-triangle me-1"></i>Bị hỏng</span>
                                            <span th:if="${copy.status.name() == 'LOST'}" class="badge bg-danger text-white px-2 py-1"><i class="bi bi-x-octagon me-1"></i>Mất sách</span>
                                            <span th:if="${copy.status.name() == 'DISPOSED'}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2 py-1"><i class="bi bi-trash me-1"></i>Đã thanh lý</span>
                                        </td>
                                        <td><a class="btn btn-outline-primary btn-sm"
                                                th:href="@{/librarian/copies/{id}(id=${copy.id})}">Chi tiết</a></td>
                                    </tr>
                                    <tr th:if="${result.empty}">
                                        <td colspan="6" class="text-center">Không có bản sao phù hợp.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <nav
                            th:replace="~{fragments/layout :: pagination(${result}, @{/librarian/copies(keyword=${keyword}, status=${status})})}">
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
