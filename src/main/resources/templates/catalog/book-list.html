<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục sách')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-4">
    <div class="panel page-spacer">

        <h1 class="h4 mb-1" th:text="${keyword.isEmpty()} ? 'Danh mục sách' : 'Kết quả tìm kiếm'">Danh mục sách</h1>
        <p class="text-muted">
            Tìm thấy <strong th:text="${result.totalElements}">0</strong> đầu sách
            <span th:if="${!keyword.isEmpty()}">cho từ khóa "<span th:text="${keyword}"></span>"</span>
        </p>

        <div class="alert alert-info" th:if="${books.isEmpty()}">Không tìm thấy sách phù hợp.</div>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
            <div class="col" th:each="b : ${books}">
                <div th:replace="~{catalog/book-card :: card(${b})}"></div>
            </div>
        </div>

        <!-- Phân trang -->
        <nav class="mt-4" th:if="${result.totalPages > 1}">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${result.number == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(keyword=${keyword}, field=${field}, page=${result.number - 1})}">Trước</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link">Trang <span th:text="${result.number + 1}">1</span> / <span th:text="${result.totalPages}">1</span></span>
                </li>
                <li class="page-item" th:classappend="${result.number + 1 >= result.totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(keyword=${keyword}, field=${field}, page=${result.number + 1})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
