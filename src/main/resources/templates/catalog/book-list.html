<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục sách')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-4">
    <div class="panel page-spacer">

        <h1 class="h4 mb-1" th:text="${keyword.isEmpty()} ? 'Danh mục sách' : 'Kết quả tìm kiếm'">Danh mục sách</h1>

        <!--UC7:Lọc và sắp xếp sách -->
        <form class="row g-2 my-2" th:action="@{/books/filter}" method="get">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="field" th:value="${field}">

            <div class="col-6 col-md-3">
                <select class="form-select" name="category">
                    <option value="0">Tất cả thể loại</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${c.id == categoryId}">Thể loại</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <select class="form-select" name="year">
                    <option value="0">Tất cả năm</option>
                    <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                            th:selected="${y == year}">2020</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <select class="form-select" name="sort">
                    <option value="TITLE" th:selected="${sort == 'TITLE'}">Tên sách A-Z</option>
                    <option value="NEWEST" th:selected="${sort == 'NEWEST'}">Mới nhất</option>
                    <option value="RATING" th:selected="${sort == 'RATING'}">Đánh giá cao</option>
                </select>
            </div>
            <div class="col-6 col-md-4">
                <button type="submit" class="btn btn-primary">Lọc</button>
                <a class="btn btn-outline-secondary" th:href="@{/books(keyword=${keyword}, field=${field})}">Xóa</a>
            </div>
        </form>

        <p class="text-muted">
            Tìm thấy <strong th:text="${result.totalElements}">0</strong> đầu sách
            <span th:if="${!keyword.isEmpty()}">cho từ khóa "<span th:text="${keyword}"></span>"</span>
        </p>

        <div class="alert alert-info" th:if="${books.isEmpty()}">Không tìm thấy sách phù hợp.</div>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
            <div class="col" th:each="b : ${books}">
                <div th:replace="~{catalog/book-card :: card(${b})}"></div>
            </div>
        </div>

        <!-- Phân trang: dùng fragment dùng chung trong layout.html -->
        <nav th:replace="~{fragments/layout :: pagination(${result}, @{/books(keyword=${keyword}, field=${field}, category=${categoryId}, year=${year}, sort=${sort})})}"></nav>

    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
