<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-card">
        <div class="card-body">
            <h4 class="mb-3">Đăng nhập</h4>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" th:value="${email}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
            </form>

            <div class="mt-3 small">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
