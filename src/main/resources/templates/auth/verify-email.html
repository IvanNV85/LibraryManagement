<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xác thực email')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-card">
        <div class="card-body">
            <h4 class="mb-3">Xác thực email</h4>

            <div th:if="${success}">
                <div class="alert alert-success">Xác thực email thành công. Bạn có thể đăng nhập.</div>
                <a class="btn btn-primary" th:href="@{/login}">Đăng nhập</a>
            </div>

            <div th:unless="${success}">
                <div class="alert alert-danger">Liên kết không hợp lệ hoặc đã hết hạn.</div>
                <a class="btn btn-outline-primary" th:href="@{/resend-verification}">Gửi lại email xác thực</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
