<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-card">
        <div class="card-body">
            <h4 class="mb-3">Đặt lại mật khẩu</h4>

            <div th:if="${invalid}">
                <div class="alert alert-danger">Liên kết không hợp lệ hoặc đã hết hạn.</div>
                <a class="btn btn-outline-primary" th:href="@{/forgot-password}">Yêu cầu liên kết mới</a>
            </div>

            <div th:unless="${invalid}">
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="mb-3">
                        <label class="form-label" for="password">Mật khẩu mới</label>
                        <input class="form-control" type="password" id="password" name="password" required>
                        <div class="form-text">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, chữ số và ký tự đặc biệt (ví dụ @, #, !).</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
                        <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Đặt lại mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
