<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-card">
        <div class="card-body">
            <h4 class="mb-3">Đổi mật khẩu</h4>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

            <form th:action="@{/account/change-password}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                    <input class="form-control" type="password" id="currentPassword" name="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <input class="form-control" type="password" id="newPassword" name="newPassword" required>
                    <div class="form-text">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, chữ số và ký tự đặc biệt (ví dụ @, #, !).</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Đổi mật khẩu</button>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
