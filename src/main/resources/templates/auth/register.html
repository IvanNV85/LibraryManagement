<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-card">
        <div class="card-body">
            <h4 class="mb-3">Đăng ký tài khoản độc giả</h4>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/register}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="fullName">Họ tên</label>
                    <input class="form-control" type="text" id="fullName" th:field="*{fullName}" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" th:field="*{email}" maxlength="150" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input class="form-control" type="password" id="password" th:field="*{password}" required>
                    <div class="form-text">Ít nhất 6 ký tự.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                    <input class="form-control" type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
            </form>

            <div class="mt-3 small">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
