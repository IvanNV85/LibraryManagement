<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gửi lại email xác thực')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container">
    <div class="card auth-card">
        <div class="card-body">
            <h4 class="mb-3">Gửi lại email xác thực</h4>

            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

            <form th:action="@{/resend-verification}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="email">Email đã đăng ký</label>
                    <input class="form-control" type="email" id="email" name="email" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Gửi lại</button>
            </form>

            <div class="mt-3 small"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
