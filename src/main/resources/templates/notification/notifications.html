<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông báo')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<!-- UC15 Xem thông báo trong web -->
<div class="container my-4" style="max-width: 820px;">
    <div class="panel page-spacer">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Thông báo</h1>
            <form th:action="@{/reader/notifications/read-all}" method="post" th:if="${unreadNotifications > 0}">
                <button class="btn btn-sm btn-outline-secondary" type="submit">Đánh dấu tất cả đã đọc</button>
            </form>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="alert alert-info" th:if="${notifications.isEmpty()}">Bạn chưa có thông báo nào.</div>

        <div class="list-group">
            <div class="list-group-item" th:each="n : ${notifications}"
                 th:classappend="${!n.seen} ? 'list-group-item-primary'">
                <div class="d-flex gap-3">
                    <span class="icon-circle"><i class="bi" th:classappend="${n.type.icon}"></i></span>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between gap-2">
                            <span th:class="${!n.seen} ? 'fw-bold' : 'fw-semibold'" th:text="${n.title}">Tiêu đề</span>
                            <span class="small text-muted text-nowrap"
                                  th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                        </div>
                        <div th:text="${n.content}">Nội dung</div>
                        <div class="mt-2 d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{${n.type.path}}">Xem</a>
                            <form th:if="${!n.seen}" th:action="@{/reader/notifications/{id}/read(id=${n.id})}" method="post">
                                <input type="hidden" name="page" th:value="${result.number}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit">Đánh dấu đã đọc</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav th:replace="~{fragments/layout :: pagination(${result}, @{/reader/notifications})}"></nav>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
